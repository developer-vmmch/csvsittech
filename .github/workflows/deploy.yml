name: CSVS IT TECH — Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # 1. Automated Test & Lint Validation
  # ------------------------------------------------------------
  test:
    name: Run Checks & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Django Configuration
        run: |
          DEBUG=True python manage.py check

      - name: Run Unit Tests
        run: |
          DEBUG=True python manage.py test apps.patients apps.lab

  # ------------------------------------------------------------
  # 2. Production Deployment to AWS EC2
  # ------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2 (csvsittech.in)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          timeout: 120s
          script: |
            set -e
            echo "Starting deployment on $(hostname)..."
            /var/www/csvsittech/deploy/scripts/deploy.sh main
