<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100" height="100">
  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="56" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="60" cy="60" r="41" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  
  <!-- Text on Curved Path or Top/Bottom -->
  <path id="topCurve" d="M 22,60 A 38,38 0 0,1 98,60" fill="none"/>
  <path id="bottomCurve" d="M 98,60 A 38,38 0 0,1 22,60" fill="none"/>
  
  <text font-family="'Arial Black', Arial, sans-serif" font-size="6.5" font-weight="900" fill="#000000" text-anchor="middle">
    <textPath href="#topCurve" startOffset="50%">
      VINAYAKA MISSION'S
    </textPath>
  </text>
  
  <text font-family="'Arial Black', Arial, sans-serif" font-size="6" font-weight="900" fill="#000000" text-anchor="middle">
    <textPath href="#bottomCurve" startOffset="50%">
      MEDICAL COLLEGE
    </textPath>
  </text>
  
  <!-- Inner Details -->
  <!-- Globe / Grid lines -->
  <circle cx="60" cy="60" r="30" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <ellipse cx="60" cy="60" rx="14" ry="29" fill="none" stroke="#64748b" stroke-width="1"/>
  <line x1="30" y1="60" x2="90" y2="60" stroke="#64748b" stroke-width="1"/>
  <line x1="34" y1="45" x2="86" y2="45" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="34" y1="75" x2="86" y2="75" stroke="#94a3b8" stroke-width="0.8"/>
  
  <!-- Caduceus / Medical Emblem / Lamp in Gold & Deep Red -->
  <!-- Winged Rod & Serpents / Flame -->
  <path d="M 60,36 L 60,84" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <!-- Flame top -->
  <path d="M 60,33 C 57,37 56,41 60,45 C 64,41 63,37 60,33 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="0.5"/>
  <circle cx="60" cy="33" r="3" fill="#f59e0b"/>
  
  <!-- Serpents / Ribbon -->
  <path d="M 52,48 Q 68,52 60,58 Q 52,64 68,70 Q 60,76 54,80" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <path d="M 68,48 Q 52,52 60,58 Q 68,64 52,70 Q 60,76 66,80" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Small Star Accents -->
  <polygon points="60,26 61.5,29 65,29.5 62.5,32 63,35 60,33.5 57,35 57.5,32 55,29.5 58.5,29" fill="#000000"/>
</svg>
