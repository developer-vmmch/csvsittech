<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-mis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="kpi-grad-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow-mis" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad-mis)"/>

  <!-- Command Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>

  <!-- Left: Executive KPI Control Panels -->
  <g transform="translate(100, 160)">
    <rect width="560" height="380" rx="16" fill="#1c0a00" stroke="#f97316" stroke-width="2" opacity="0.92" filter="url(#glow-mis)"/>
    <rect x="20" y="20" width="520" height="40" rx="8" fill="#431407"/>
    <text x="40" y="46" fill="#fed7aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">HOSPITAL MANAGEMENT INFORMATION SYSTEM (MIS)</text>

    <!-- 4 KPI Boxes -->
    <g transform="translate(20, 80)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="245" height="110" rx="10" fill="#2a1005" stroke="#ea580c" stroke-width="1.5"/>
      <text x="20" y="30" fill="#fdba74" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">OVERALL BED OCCUPANCY</text>
      <text x="20" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">92.4%</text>
      <text x="20" y="95" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">▲ +4.2% vs last month</text>

      <!-- KPI 2 -->
      <rect x="275" y="0" width="245" height="110" rx="10" fill="#2a1005" stroke="#ea580c" stroke-width="1.5"/>
      <text x="295" y="30" fill="#fdba74" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">AVERAGE PATIENT STAY (ALOS)</text>
      <text x="295" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">3.8 Days</text>
      <text x="295" y="95" fill="#60a5fa" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Optimal Clinical Benchmark</text>

      <!-- KPI 3 -->
      <rect x="0" y="130" width="245" height="110" rx="10" fill="#2a1005" stroke="#ea580c" stroke-width="1.5"/>
      <text x="20" y="160" fill="#fdba74" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">OPERATION THEATRE UTILIZATION</text>
      <text x="20" y="200" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">88.6%</text>
      <text x="20" y="225" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">12 Surgeries Scheduled Today</text>

      <!-- KPI 4 -->
      <rect x="275" y="130" width="245" height="110" rx="10" fill="#2a1005" stroke="#ea580c" stroke-width="1.5"/>
      <text x="295" y="160" fill="#fdba74" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">DIAGNOSTIC LAB TURNAROUND (TAT)</text>
      <text x="295" y="200" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">42 Mins</text>
      <text x="295" y="225" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">98.2% on-time release</text>
    </g>
  </g>

  <!-- Right: Executive Radar & Realtime Clinical Ops -->
  <g transform="translate(1260, 160)">
    <rect width="560" height="380" rx="16" fill="#1c0a00" stroke="#f97316" stroke-width="2" opacity="0.92" filter="url(#glow-mis)"/>
    <rect x="20" y="20" width="520" height="40" rx="8" fill="#431407"/>
    <text x="40" y="46" fill="#fed7aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">HOSPITAL CAPACITY &amp; RESOURCE TELEMETRY</text>

    <!-- Progress Gauges -->
    <g transform="translate(40, 90)">
      <text x="0" y="20" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">ICU / Critical Care Capacity (48 / 50 Beds)</text>
      <rect x="0" y="30" width="480" height="18" rx="9" fill="#431407"/>
      <rect x="0" y="30" width="460" height="18" rx="9" fill="url(#kpi-grad-orange)"/>

      <text x="0" y="80" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Emergency &amp; Trauma Triage Flow</text>
      <rect x="0" y="90" width="480" height="18" rx="9" fill="#431407"/>
      <rect x="0" y="90" width="380" height="18" rx="9" fill="#38bdf8"/>

      <text x="0" y="140" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Pharmacy &amp; Blood Bank Reserve Levels</text>
      <rect x="0" y="150" width="480" height="18" rx="9" fill="#431407"/>
      <rect x="0" y="150" width="440" height="18" rx="9" fill="#34d399"/>

      <text x="0" y="200" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Doctor &amp; Nursing Staff Deployment Rate</text>
      <rect x="0" y="210" width="480" height="18" rx="9" fill="#431407"/>
      <rect x="0" y="210" width="470" height="18" rx="9" fill="#a78bfa"/>
    </g>
  </g>
</svg>
