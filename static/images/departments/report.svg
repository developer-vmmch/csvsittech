<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-rep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="chart-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="chart-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow-rep" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad-rep)"/>

  <!-- Subtle Matrix Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="220" x2="1920" y2="220"/>
    <line x1="0" y1="440" x2="1920" y2="440"/>
    <line x1="0" y1="660" x2="1920" y2="660"/>
    <line x1="0" y1="880" x2="1920" y2="880"/>
    <line x1="380" y1="0" x2="380" y2="1080"/>
    <line x1="760" y1="0" x2="760" y2="1080"/>
    <line x1="1140" y1="0" x2="1140" y2="1080"/>
    <line x1="1520" y1="0" x2="1520" y2="1080"/>
  </g>

  <!-- Left: Multi-Chart Statistical Analytics Wall -->
  <g transform="translate(100, 160)">
    <rect width="560" height="380" rx="16" fill="#022c22" stroke="#34d399" stroke-width="2" opacity="0.9" filter="url(#glow-rep)"/>
    <rect x="20" y="20" width="520" height="40" rx="8" fill="#064e3b"/>
    <text x="40" y="46" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">HOSPITAL CLINICAL WORKLOAD &amp; CENSUS ANALYTICS</text>

    <!-- Area Curve Chart -->
    <path d="M 40 300 Q 120 180, 200 240 T 360 140 T 500 110 L 500 320 L 40 320 Z" fill="url(#chart-grad-1)" opacity="0.35"/>
    <path d="M 40 300 Q 120 180, 200 240 T 360 140 T 500 110" fill="none" stroke="#34d399" stroke-width="4"/>

    <!-- Data Points -->
    <circle cx="200" cy="240" r="6" fill="#ffffff" stroke="#059669" stroke-width="3"/>
    <text x="180" y="225" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">OPD: 1,420</text>
    
    <circle cx="360" cy="140" r="6" fill="#ffffff" stroke="#059669" stroke-width="3"/>
    <text x="340" y="125" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">IPD: 850</text>

    <circle cx="500" cy="110" r="6" fill="#ffffff" stroke="#059669" stroke-width="3"/>
    <text x="440" y="95" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">LAB TESTS: 3,240</text>

    <!-- X Axis -->
    <line x1="30" y1="320" x2="530" y2="320" stroke="#047857" stroke-width="2"/>
    <text x="50" y="345" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">WEEK 1</text>
    <text x="180" y="345" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">WEEK 2</text>
    <text x="330" y="345" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">WEEK 3</text>
    <text x="470" y="345" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">WEEK 4</text>
  </g>

  <!-- Right: Department Distribution Donut & Metrics -->
  <g transform="translate(1260, 160)">
    <rect width="560" height="380" rx="16" fill="#022c22" stroke="#10b981" stroke-width="2" opacity="0.9" filter="url(#glow-rep)"/>
    <rect x="20" y="20" width="520" height="40" rx="8" fill="#064e3b"/>
    <text x="40" y="46" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">SPECIALTY WORKLOAD DISTRIBUTION REPORT</text>

    <!-- Donut Segments simulation -->
    <g transform="translate(160, 200)">
      <circle cx="0" cy="0" r="90" fill="none" stroke="#064e3b" stroke-width="35"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#34d399" stroke-width="35" stroke-dasharray="220 565" stroke-dashoffset="0"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#60a5fa" stroke-width="35" stroke-dasharray="160 565" stroke-dashoffset="-225"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#fbbf24" stroke-width="35" stroke-dasharray="110 565" stroke-dashoffset="-390"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#f87171" stroke-width="35" stroke-dasharray="75 565" stroke-dashoffset="-505"/>
      <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">100%</text>
    </g>

    <!-- Legend -->
    <g transform="translate(320, 110)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#34d399"/>
      <text x="25" y="14" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">General Medicine (39%)</text>

      <rect x="0" y="40" width="16" height="16" rx="4" fill="#60a5fa"/>
      <text x="25" y="54" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">General Surgery (28%)</text>

      <rect x="0" y="80" width="16" height="16" rx="4" fill="#fbbf24"/>
      <text x="25" y="94" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Pediatrics &amp; OBG (19%)</text>

      <rect x="0" y="120" width="16" height="16" rx="4" fill="#f87171"/>
      <text x="25" y="134" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Orthopedics &amp; Others (14%)</text>
    </g>
  </g>
</svg>
