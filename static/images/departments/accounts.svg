<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent-acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="green-acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow-acc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1920" height="1080" fill="url(#bg-grad-acc)"/>
  
  <!-- Subtle Office Environment Grids -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="1080"/>
    <line x1="600" y1="0" x2="600" y2="1080"/>
    <line x1="900" y1="0" x2="900" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1500" y1="0" x2="1500" y2="1080"/>
  </g>

  <!-- Left Side: Accounting Data Screen & Ledgers -->
  <g transform="translate(120, 180)">
    <!-- Monitor 1 Frame -->
    <rect width="520" height="340" rx="16" fill="#0b1e42" stroke="#38bdf8" stroke-width="2" opacity="0.85" filter="url(#glow-acc)"/>
    <rect x="20" y="20" width="480" height="40" rx="8" fill="#1e293b"/>
    <circle cx="45" cy="40" r="6" fill="#ef4444"/>
    <circle cx="65" cy="40" r="6" fill="#f59e0b"/>
    <circle cx="85" cy="40" r="6" fill="#10b981"/>
    <text x="110" y="46" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">FINANCIAL LEDGER &amp; RECONCILIATION - FY 2025-26</text>
    
    <!-- Ledger Rows -->
    <rect x="20" y="75" width="480" height="35" rx="6" fill="#1e3a8a" opacity="0.6"/>
    <text x="35" y="98" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">CODE: ACC-104</text>
    <text x="180" y="98" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">OPD Revenue Collection</text>
    <text x="400" y="98" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">₹ 8,45,200.00</text>

    <rect x="20" y="120" width="480" height="35" rx="6" fill="#1e293b" opacity="0.6"/>
    <text x="35" y="143" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">CODE: ACC-108</text>
    <text x="180" y="143" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">IPD Billing Settlements</text>
    <text x="400" y="143" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">₹ 14,92,650.00</text>

    <rect x="20" y="165" width="480" height="35" rx="6" fill="#1e3a8a" opacity="0.6"/>
    <text x="35" y="188" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">CODE: ACC-215</text>
    <text x="180" y="188" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Pharmacy / Drug Invoices</text>
    <text x="400" y="188" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">₹ 6,18,400.00</text>

    <rect x="20" y="210" width="480" height="35" rx="6" fill="#1e293b" opacity="0.6"/>
    <text x="35" y="233" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">CODE: ACC-320</text>
    <text x="180" y="233" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Insurance TPA Claims</text>
    <text x="400" y="233" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">₹ 9,75,000.00</text>

    <!-- Total Bar -->
    <rect x="20" y="260" width="480" height="50" rx="8" fill="url(#accent-acc)" opacity="0.9"/>
    <text x="35" y="292" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">TOTAL CONSOLIDATED AUDIT</text>
    <text x="360" y="292" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800">₹ 39,31,250.00</text>
    
    <!-- Monitor Stand -->
    <rect x="230" y="340" width="60" height="70" fill="#1e293b"/>
    <rect x="180" y="410" width="160" height="15" rx="6" fill="#334155"/>
  </g>

  <!-- Right Side: Financial Analytics & Vault Graphics -->
  <g transform="translate(1260, 180)">
    <!-- Card 1: Revenue Graph Card -->
    <rect width="540" height="340" rx="16" fill="#0b1e42" stroke="#0ea5e9" stroke-width="2" opacity="0.85" filter="url(#glow-acc)"/>
    <rect x="20" y="20" width="500" height="40" rx="8" fill="#1e293b"/>
    <text x="35" y="46" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">HOSPITAL CASHFLOW &amp; DISBURSEMENTS</text>

    <!-- Bar Chart -->
    <g transform="translate(40, 90)">
      <!-- Bars -->
      <rect x="20" y="110" width="45" height="90" rx="6" fill="#38bdf8" opacity="0.8"/>
      <rect x="85" y="60" width="45" height="140" rx="6" fill="#0284c7"/>
      <rect x="150" y="40" width="45" height="160" rx="6" fill="#34d399"/>
      <rect x="215" y="80" width="45" height="120" rx="6" fill="#38bdf8" opacity="0.8"/>
      <rect x="280" y="30" width="45" height="170" rx="6" fill="#34d399"/>
      <rect x="345" y="15" width="45" height="185" rx="6" fill="#10b981"/>
      <rect x="410" y="50" width="45" height="150" rx="6" fill="#0284c7"/>
      
      <!-- Axis -->
      <line x1="0" y1="200" x2="480" y2="200" stroke="#64748b" stroke-width="2"/>
      
      <text x="28" y="220" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">APR</text>
      <text x="93" y="220" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">MAY</text>
      <text x="158" y="220" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">JUN</text>
      <text x="223" y="220" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">JUL</text>
      <text x="288" y="220" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">AUG</text>
      <text x="353" y="220" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">SEP</text>
      <text x="418" y="220" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">OCT</text>
    </g>

    <!-- Monitor Stand -->
    <rect x="240" y="340" width="60" height="70" fill="#1e293b"/>
    <rect x="190" y="410" width="160" height="15" rx="6" fill="#334155"/>
  </g>

  <!-- Ambient Floating Icons -->
  <g opacity="0.15" fill="#38bdf8">
    <circle cx="200" cy="850" r="80"/>
    <circle cx="1700" cy="850" r="100"/>
    <path d="M960,100 L970,120 L990,125 L975,140 L980,160 L960,150 L940,160 L945,140 L930,125 L950,120 Z" fill="#ffffff"/>
  </g>
</svg>
