{% extends 'base.html' %}

{% block title %}Access Denied | VMMC ERP{% endblock %}

{% block content %}
<div class="container-fluid py-5 text-center">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 500px;">
        <div class="card-body p-5">
            <i class="bi bi-shield-lock text-danger" style="font-size: 4rem;"></i>
            <h3 class="fw-bold mt-4 mb-3 text-dark">Access Denied</h3>
            <p class="text-muted mb-4">{{ exception|default:"You do not have permission to view this page or perform this action." }}</p>
            <button onclick="window.history.back()" class="btn btn-primary px-4">
                <i class="bi bi-arrow-left me-2"></i> Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
