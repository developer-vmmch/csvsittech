# ============================================================
# Nginx Configuration for CSVS IT TECH (csvsittech.in)
# ============================================================

upstream csvsittech_gunicorn {
    server unix:/run/gunicorn/csvsittech.sock fail_timeout=0;
}

# ------------------------------------------------------------
# 1. HTTP Server - Redirect all traffic to HTTPS & Certbot
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name csvsittech.in www.csvsittech.in;

    # Let's Encrypt / Certbot verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# 2. HTTPS Server - SSL Termination and Reverse Proxy
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name csvsittech.in www.csvsittech.in;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/csvsittech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csvsittech.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL Session Caching
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max upload size (for patient documents, excel imports & lab reports)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Files Directory
    location /static/ {
        alias /var/www/csvsittech/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media Uploads Directory
    location /media/ {
        alias /var/www/csvsittech/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Certbot challenge path over HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Dynamic Application Requests -> Gunicorn
    location / {
        proxy_pass http://csvsittech_gunicorn;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_redirect off;
        proxy_buffering on;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Logging
    access_log /var/log/nginx/csvsittech_access.log;
    error_log /var/log/nginx/csvsittech_error.log warn;
}
